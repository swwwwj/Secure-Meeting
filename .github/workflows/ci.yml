name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-service-tests:
    name: AI Service Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai_service/requirements.txt

      - name: Install dependencies
        working-directory: ai_service
        run: python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: ai_service
        run: python -m pytest

  meeting-server-tests:
    name: Meeting Server Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: meeting_server/requirements.txt

      - name: Install dependencies
        working-directory: meeting_server
        run: python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: meeting_server
        run: python -m pytest

  meeting-server-migrations:
    name: Meeting Server Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: meeting_server/requirements.txt

      - name: Install dependencies
        working-directory: meeting_server
        run: python -m pip install -r requirements.txt

      - name: Run migrations from empty database
        working-directory: meeting_server
        env:
          SM_ENV: test
          SM_MEETING_DATABASE_URL: sqlite:///./ci_migration_check.db
          SM_API_PREFIX: /api/v1
        run: python -m alembic upgrade head

  client-build:
    name: Client Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            ninja-build \
            qt6-base-dev \
            qt6-multimedia-dev

      - name: Configure client
        run: cmake -S . -B build-client -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build client
        run: cmake --build build-client --config Release
